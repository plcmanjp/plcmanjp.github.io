<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ladder Quest">
  <!-- 아트 방향 확정 전 플레이스홀더다 (S0008). 래더 한 렁 — 좌우 모선 사이에
       A접점 하나와 코일 하나가 놓인 모양을 단색 도형으로만 그린다. -->
  <rect width="512" height="512" rx="96" fill="#11161c"/>
  <g stroke="#6fe08a" stroke-width="18" fill="none" stroke-linecap="round">
    <!-- 좌우 모선 -->
    <path d="M96 128 V384"/>
    <path d="M416 128 V384"/>
    <!-- 렁 배선 -->
    <path d="M96 256 H188"/>
    <path d="M244 256 H320"/>
    <!-- A접점 -->
    <path d="M188 212 V300"/>
    <path d="M244 212 V300"/>
    <!-- 코일 -->
    <path d="M320 256 H336"/>
    <circle cx="372" cy="256" r="36"/>
  </g>
</svg>
